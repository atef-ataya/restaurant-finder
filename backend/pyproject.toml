[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "restaurant-finder"
version = "1.0.0"
description = "AI-powered restaurant finder"

[tool.poetry.dependencies]
python = "^3.10"
crewai = "^0.80.0"
crewai-tools = "^0.17.0"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
python-dotenv = "^1.0.0"
pydantic = "^2.5.0"

[tool.crewai]
main = "src.restaurant_finder.main:run"